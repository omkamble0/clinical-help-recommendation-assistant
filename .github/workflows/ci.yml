name: AegisMed CI - Automated Verification & Container Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. Backend Verification & 120 Clinical RAG Tests
  # ============================================================================
  backend-verification:
    name: Backend Test Suite (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "api/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install CPU-only PyTorch wheel to optimize runner download time & disk space
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r api/requirements.txt
          pip install pytest pytest-cov

      - name: Run Clinical Verification & Integration Tests (120 Tests)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api
          TESTING: "true"
          ENVIRONMENT: "testing"
        run: |
          python -m pytest tests -v --maxfail=5

  # ============================================================================
  # 2. Frontend Production Build Verification
  # ============================================================================
  frontend-build:
    name: Frontend Build & Static Export (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Next.js Production Static Export
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build

      - name: Verify Static Build Artifacts
        run: |
          test -d out
          test -f out/index.html
          echo "Next.js static export compiled successfully."

  # ============================================================================
  # 3. Docker Container Build, Trivy Security Scan & Smoke Test
  # ============================================================================
  docker-validation-and-security:
    name: Docker Build, Security Scan & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-verification, frontend-build]
    timeout-minutes: 20

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend API Docker Image
        run: |
          docker build -t aegismed-api:test ./api

      - name: Build Frontend Web Docker Image
        run: |
          docker build -t aegismed-web:test ./web

      - name: Scan API Container Image with Trivy (Security Vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "aegismed-api:test"
          format: "table"
          exit-code: "0" # Audit report mode
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Scan Web Container Image with Trivy (Security Vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "aegismed-web:test"
          format: "table"
          exit-code: "0" # Audit report mode
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Container Orchestration Smoke Test
        run: |
          # Start multi-container stack in background
          docker compose up -d

          # Allow containers to initialize and complete healthcheck grace period
          sleep 20

          # Verify container status
          docker compose ps

          # Ping API healthcheck endpoint
          curl -f http://localhost:8000/health || (docker compose logs api && exit 1)

          # Ping Web frontend healthcheck endpoint
          curl -f http://localhost:3000/health || (docker compose logs web && exit 1)

          echo "Container health probes passed successfully."

          # Clean up
          docker compose down -v
